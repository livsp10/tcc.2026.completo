<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos | Culto à Ciência</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Barra de Acessibilidade Flutuante -->
    <div class="accessibility-floating" id="barra-acessibilidade">
        <button type="button" id="btn-aumentar-fonte" class="accessibility-floating__btn" title="Aumentar Fonte">A+</button>
        <button type="button" id="btn-restaurar-fonte" class="accessibility-floating__btn" title="Tamanho Padrão">A</button>
        <button type="button" id="btn-diminuir-fonte" class="accessibility-floating__btn" title="Diminuir Fonte">A-</button>
        <button type="button" id="btn-alto-contraste" class="accessibility-floating__btn" title="Alto Contraste">
            <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
        </button>
    </div>

    <!-- Cabeçalho Simples com Botão de Voltar -->
    <header class="header" id="header">
        <div class="header__container">
            <a href="index.html" class="header__brand">
                <div class="header__logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="header__titles">
                    <span class="header__school-name">Culto à Ciência</span>
                </div>
            </a>
            <a href="index.html" class="btn btn--outline" style="color: var(--cor-primaria); border-color: var(--cor-primaria); padding: 0.5rem 1rem;">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>
    </header>

    <main id="conteudo-principal">
        <section class="section galeria" style="padding-top: 3rem;">
            <div class="container">
                <header class="section__header">
                    <span class="section__subtitle">Estrutura e Espaços</span>
                    <h1 class="section__title">Galeria Completa</h1>
                    <p class="section__description">Navegue por todas as fotos das instalações e espaços centenários da nossa escola.</p>
                </header>

                <!--grid das fotos-->
                <div class="galeria__grid">
                    <div class="galeria__item">
                        <img src="galeria/g.fachada.diag.jpg" alt="Fachada em diagonal" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                    </div>
                    <div class="galeria__item">
                        <img src="galeria/g.lab.bio.jpg" alt="Laboratório de Biologia" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                    </div>
                    <div class="galeria__item">
                        <img src="galeria/g.quadra2.jpg" alt="Quadra Poliesportiva" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                    </div>
                    <div class="galeria__item">
                        <img src="galeria/g.jard.pt2.jpg" alt="Jardim e Pátio Interno" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                    </div>
                    <div class="galeria__item">
                        <img src="galeria/g.sala14.jpg" alt="Sala de Aula Padrão" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                    </div>
                    <div class="galeria__item">
                        <img src="galeria/g.informatica.jpg" alt="Sala de Informática" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                    </div>
                    <div class="galeria__item">
                        <img src="galeria/g.pt.1.jpg" alt="Pátio Principal" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                    </div>
                    <!-- colocar mais fotos-->
                </div> 
            </div>
        </section>
    </main>

    <!-- Lightbox Modal (ampliar as fotos)-->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de Imagem" hidden>
        <div class="lightbox__backdrop" id="lightbox-backdrop"></div>
        <div class="lightbox__content">
            <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Fechar visualizador">&times;</button>
            <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Imagem anterior">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </button>
            <div class="lightbox__body">
                <div class="lightbox__placeholder" id="lightbox-display" style="background: none; border: none; padding: 0;"></div>
            </div>
            <button type="button" class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Próxima imagem">
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <!-- pé -->
    <footer class="footer" style="padding: 2rem 0;">
        <div class="container" style="text-align: center; color: rgba(255, 255, 255, 0.7); font-size: 0.85rem;">
            <p>&copy; 2026 Escola Estadual Culto à Ciência. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
